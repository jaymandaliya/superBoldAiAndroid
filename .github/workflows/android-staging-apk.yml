name: Android Staging APK

# Builds a release-signed Android APK and uploads it as a workflow artifact.
# Staging-only — uses the checked-in `my-release-key.jks` keystore. Does NOT
# publish a GitHub Release and does NOT use production signing secrets.
#
# Triggers:
#   • push to the `staging` branch
#   • push to the `feat/one-one-talking` branch (for testing this pipeline
#     before it merges to staging)
#   • manual via the Actions tab → "Run workflow"
on:
  push:
    branches:
      - staging
      - feat/one-one-talking
  workflow_dispatch:
    inputs:
      build_label:
        description: 'Optional label appended to the APK filename (e.g. "hotfix")'
        required: false
        default: ''

concurrency:
  group: android-staging-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build staging APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm ci

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Compute build metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_TIME=$(date -u +"%Y%m%d-%H%M")
          PKG_VERSION=$(node -p "require('./package.json').version")
          LABEL_RAW="${{ github.event.inputs.build_label }}"
          LABEL=""
          if [ -n "$LABEL_RAW" ]; then
            LABEL="-$(echo "$LABEL_RAW" | tr -cd '[:alnum:]-_' | cut -c1-20)"
          fi
          APK_NAME="scaleu-staging-v${PKG_VERSION}-${BUILD_TIME}-${SHORT_SHA}${LABEL}.apk"
          {
            echo "short_sha=${SHORT_SHA}"
            echo "build_time=${BUILD_TIME}"
            echo "pkg_version=${PKG_VERSION}"
            echo "apk_name=${APK_NAME}"
          } >> "$GITHUB_OUTPUT"
          echo "Build metadata:"
          echo "  version  = ${PKG_VERSION}"
          echo "  sha      = ${SHORT_SHA}"
          echo "  time     = ${BUILD_TIME}"
          echo "  filename = ${APK_NAME}"

      - name: Build release APK
        run: ./android/gradlew --no-daemon -p android assembleRelease

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK produced under android/app/build/outputs/apk/release"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Rename APK with version + sha
        run: |
          mkdir -p artifacts
          cp "${{ steps.apk.outputs.path }}" "artifacts/${{ steps.meta.outputs.apk_name }}"
          ls -lh artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: artifacts/${{ steps.meta.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Job summary
        run: |
          {
            echo "## ✅ Staging APK built"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | \`${{ steps.meta.outputs.pkg_version }}\` |"
            echo "| Commit | \`${{ steps.meta.outputs.short_sha }}\` |"
            echo "| Built at | \`${{ steps.meta.outputs.build_time }} UTC\` |"
            echo "| Artifact | \`${{ steps.meta.outputs.apk_name }}\` |"
            echo ""
            echo "Download from the **Artifacts** section of this run."
          } >> "$GITHUB_STEP_SUMMARY"
